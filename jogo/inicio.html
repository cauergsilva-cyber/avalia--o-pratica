<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Site</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0c0e;
      background-image: url("../assets/fundoRoblox.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      color: #ffffff;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }


    
    header {
      position: absolute;
      top: 28px;
      left: 55%;
      transform: translateX(-50%);
      text-align: center;
    }

    header h1 {
      font-size: 38px;
      font-weight: 800;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9);
    }

   
    .login-card {
      position: absolute;
      top: 50%;
      left: 5%;
      transform: translateY(-50%);
      background-color: #191b1f;
      width: 100%;
      max-width: 390px;
      padding: 32px 28px;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
    }

    .login-card h2 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e5e7eb;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      background-color: #23252a;
      border: 1px solid #494d55;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 15px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    input::placeholder {
      color: #9ca3af;
    }

    input:focus {
      border-color: #ffffff;
    }

    #senha {
      padding-right: 44px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #d1d5db;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .toggle-password:hover {
      color: #ffffff;
    }

    .btn-entrar {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      background-color: #393b3d;
      color: #8b8d91;
      cursor: not-allowed;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-entrar.ativo {
      background-color: #ffffff;
      color: #111214;
      cursor: pointer;
    }

    .btn-entrar.ativo:hover {
      background-color: #e5e7eb;
    }

    .forgot-link {
      display: inline-block;
      margin-top: 18px;
      font-size: 14px;
      color: #ffffff;
      text-decoration: underline;
    }

    .acoes-login {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    .btn-criar-conta {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      text-decoration: underline;
      padding: 0;
    }

    .campo-escondido {
      display: none;
    }

    .mensagem-formulario {
      min-height: 18px;
      margin-top: 12px;
      font-size: 13px;
      color: #d1d5db;
    }

    .galeria {
      position: absolute;
      top: 31%;
      right: 4%;
      width: 52%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      z-index: 1;
    }

    .imagens-roblox {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
    }

   
    .info-direita {
      position: absolute;
      bottom: 32px;
      right: 4%;
      max-width: 520px;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
    }

    .info-direita h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .info-direita p {
      font-size: 15px;
      color: #e5e7eb;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    
    footer {
      position: absolute;
      bottom: 24px;
      left: 5%;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
    }

    footer p {
      font-size: 13px;
      color: #d1d5db;
    }
  </style>
</head>
<body>

  <header>
    <h1>Roblox Site</h1>
  </header>

  <div class="login-card">
    <h2 id="tituloFormulario">Entrar</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="usuario">Nome de usuário, e-mail ou telefone</label>
        <input type="text" id="usuario" placeholder="Nome de usuário, e-mail ou telefone" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <div class="input-wrapper">
          <input type="password" id="senha" placeholder="Senha">
          <button type="button" class="toggle-password" id="btnOlho" aria-label="Mostrar senha">
            <svg id="iconeOlho" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group campo-escondido" id="grupoConfirmarSenha">
        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha" placeholder="Digite a senha novamente">
      </div>

      <p class="mensagem-formulario" id="mensagemFormulario"></p>

      <button type="submit" class="btn-entrar" id="btnEntrar" disabled>Entrar</button>
    </form>

    <div class="acoes-login">
      <a href="#" class="forgot-link">Esqueceu a senha ou nome de usuário?</a>
      <button type="button" class="btn-criar-conta" id="btnCriarConta">Criar conta</button>
    </div>
  </div>

  <div class="galeria">
    <img class="imagens-roblox" src="../assets/prison.png" alt="Prisão">
    <img class="imagens-roblox" src="../assets/grass.png" alt="Gramado">
    <img class="imagens-roblox" src="../assets/garden.png" alt="Jardim">
  </div>

  <div class="info-direita">
    <h3>Um dos jogos mais jogados pelas crianças.</h3>
    <p>Roblox é o jogo mais popular entre as crianças e o maior gerador de desigualdades.</p>
    <p>Roblox legal</p>
  </div>

  <footer>
    <p>Todos os direitos reservados para Caue goedert</p>
  </footer>

  <script src="../js/login.js"></script>

</body>
</html>
